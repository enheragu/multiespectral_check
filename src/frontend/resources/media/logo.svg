<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rightGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C52233" />
      <stop offset="50%" stop-color="#E55530" />
      <stop offset="100%" stop-color="#F9C05E" />
    </linearGradient>

    <linearGradient id="flameGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="20%" stop-color="#d51425" />
      <stop offset="50%" stop-color="#ed6019" />
      <stop offset="100%" stop-color="#f7d21a" />
    </linearGradient>

    <clipPath id="clip_red" clipPathUnits="userSpaceOnUse">
      <circle cx="38" cy="58" r="23" />
    </clipPath>
    <clipPath id="clip_green" clipPathUnits="userSpaceOnUse">
      <circle cx="50" cy="35" r="23" />
    </clipPath>
    <clipPath id="clip_blue" clipPathUnits="userSpaceOnUse">
      <circle cx="62" cy="58" r="23" />
    </clipPath>
    <clipPath id="clip_red_green" clipPathUnits="userSpaceOnUse">
      <!-- Replaced nested clipPath with explicit intersection path (red ∩ green) -->
      <path d="M27.147 37.709 A23 23 0 0 1 60.853 55.293 A23 23 0 0 1 27.147 37.709 Z" />
    </clipPath>
  </defs>

  <g stroke="none">
    <polygon points="200,40 340,120 200,200 60,120" fill="#58C2D4" />
    <polygon points="60,120 200,200 200,360 60,280" fill="#EDF3E6" />
    <polygon points="200,200 340,120 340,280 200,360" fill="url(#rightGradient)" />
  </g>

  <g transform="matrix(1.4, -0.8, 1.4, 0.8, 60, 120)">
    <polygon points="25,55 40,70 75,25 85,35 40,90 15,65" fill="#5CB85C" stroke="#304D63" stroke-width="4" stroke-linejoin="round" 
    transform="rotate(30, 100, 100) translate(-20,30)"/>
  </g>
  
  
  <g transform="matrix(1.4, 0.8, 0, 1.6, 60, 120)">
    <circle cx="38" cy="58" r="23" fill="#e21224" /> 
    <circle cx="50" cy="35" r="23" fill="#30b034" /> 
    <circle cx="62" cy="58" r="23" fill="#265dcb" /> 
    <circle cx="50" cy="35" r="23" fill="#f2de28" clip-path="url(#clip_red)" />
    <circle cx="62" cy="58" r="23" fill="#03dfe3" clip-path="url(#clip_green)" />
    <circle cx="62" cy="58" r="23" fill="#e6189e" clip-path="url(#clip_red)" />
    <circle cx="62" cy="58" r="23" fill="#FFFFFF" clip-path="url(#clip_red_green)" />

    <circle cx="38" cy="58" r="23" fill="none" stroke="#304D63" stroke-width="2.5" />
    <circle cx="50" cy="35" r="23" fill="none" stroke="#304D63" stroke-width="2.5" />
    <circle cx="62" cy="58" r="23" fill="none" stroke="#304D63" stroke-width="2.5" />
  </g>

  <g transform="matrix(1.4, -0.8, 0, 1.6, 200, 200)">
    <g transform="translate(10, 10) scale(5)">
      <path d="M8 16c3.314 0 6-2 6-5.5 0-1.5-.5-4-2.5-6 .25 1.5-1.25 2-1.25 2C11 4 9 .5 6 0c.357 2 .5 4-2 6-1.25 1-2 2.729-2 4.5C2 14 4.686 16 8 16Z" fill="url(#flameGradient)" stroke="#ab1515" stroke-width="0.8" stroke-linejoin="round" />
      <path d="M8 15c-1.657 0-3-1-3-2.75 0-.75.25-2 1.25-3C6.125 10 7 10.5 7 10.5c-.375-1.25.5-3.25 2-3.5-.179 1-.25 2 1 3 .625.5 1 1.364 1 2.25C11 14 9.657 15 8 15Z" fill="#ab1515" />
    </g>
  </g>

  <g stroke="#304D63" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="200,40 340,120 340,280 200,360 60,280 60,120" fill="none" />
    <line x1="200" y1="200" x2="200" y2="350" />
    <line x1="200" y1="200" x2="60" y2="120" />
    <line x1="200" y1="200" x2="340" y2="120" />
  </g>
</svg>
